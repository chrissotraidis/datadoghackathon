<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hanko safety regression</title>
<style>body{font:16px system-ui;background:#101719;color:#edf1e9;max-width:950px;margin:40px auto;padding:20px}button{font:inherit;padding:12px}pre{white-space:pre-wrap;line-height:1.6}.pass{color:#b5d7a0}.fail{color:#ffaaa0}</style>
<h1>Hanko safety regression</h1>
<p>Isolated in-memory storage and mocked call responses. No config is loaded, no external API is called, and existing ledger records and locks are untouched.</p>
<button id="run">Run regression checks</button><pre id="output" role="status"></pre>
<script type="module">
const version = Date.now();
const { parseRequest, analyze, checkPolicy } = await import(`./lib/impact.js?regression=${version}`);
const { loadMock } = await import(`./lib/mockdata.js?regression=${version}`);
const { requestApproval, alreadyCalled } = await import(`./lib/call.js?regression=${version}`);
const ledger = await import(`./lib/ledger.js?regression=${version}`);
const output = document.querySelector('#output');
const button = document.querySelector('#run');
const proposal = r => !r.parsed_with_defaults && r.category === 7 && r.field === 'TAX-RATE-CAT7' && Number(r.from) === .08 && Number(r.to) === .10 && r.effective === '2027-04-01';
const baseText = 'From April, consumption tax on category 7 goes from 8 to 10 percent.';
button.onclick = async () => {
  button.disabled = true; output.textContent = ''; let passed = 0, failed = 0;
  const report = (name, ok, detail = '') => {
    output.textContent += `${ok ? 'PASS' : 'FAIL'} ${name}${detail ? ': ' + detail : ''}\n`;
    ok ? passed++ : failed++;
  };
  const originalFetch = window.fetch;
  const storageDescriptor = Object.getOwnPropertyDescriptor(window, 'localStorage');
  const memory = new Map();
  const isolatedStorage = { getItem: key => memory.get(key) ?? null, setItem: (key, value) => memory.set(key, String(value)), removeItem: key => memory.delete(key) };
  window.fetch = (url, options) => {
    if (new URL(url, location.href).origin !== location.origin) throw new Error('External network disabled by regression harness');
    return originalFetch(url, options);
  };
  try {
    Object.defineProperty(window, 'localStorage', { configurable: true, value: isolatedStorage });
    const mock = await loadMock();
    const request = parseRequest(baseText), impact = await analyze(request, mock, '');
    report('real fixture impact', impact.affected_records === 1214 && impact.jobs.length === 3 && impact.paragraph.name === 'CALC-TAX');
    const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(mock.diff)))].map(n => n.toString(16).padStart(2, '0')).join('');
    report('test evidence matches current diff', mock.testResult.passed === true && mock.testResult.diff_sha256 === hash);
    for (const [label, text] of [
      ['explicit different year held', baseText.replace('April', 'April 2030')],
      ['explicit different day held', baseText.replace('April', 'April 15')],
      ['fractional rate mismatch held', baseText.replace('8 to 10', '8.1 to 9.6')],
      ['different category held', baseText.replace('category 7', 'category 8')],
      ['missing fields held', 'Please change the tax']
    ]) { const parsed = parseRequest(text); report(label, !proposal(parsed), JSON.stringify({from:parsed.from,to:parsed.to,effective:parsed.effective,defaults:parsed.parsed_with_defaults})); }
    const now = new Date(Date.now() + 9 * 3600000), minute = now.getUTCHours() * 60 + now.getUTCMinutes();
    const clock = n => `${String(Math.floor((n + 1440) % 1440 / 60)).padStart(2,'0')}:${String((n + 1440) % 60).padStart(2,'0')}`;
    const policy = { ...checkPolicy(request, impact, mock.policy), owner_phone: 'env:OWNER_PHONE', hours: `${clock(minute - 5)}-${clock(minute + 5)} JST` };
    const args = { request: {...request,id:'REG-CALL'}, impact, policy, config:{demoMode:'canned'} };
    const secondModule = await import(`./lib/call.js?regression-independent=${version}`);
    const results = await Promise.all([requestApproval(args), secondModule.requestApproval(args)]);
    report('independent-module concurrent lock owner', results.filter(r => r.attempted === true).length === 1 && results.filter(r => r.attempted === false).length === 1);
    report('canned condition and four transcript lines', results.some(r => r.decision === 'conditional' && r.transcript.length === 4));
    const invalid = await requestApproval({...args, request:{...request,id:'REG-PREFLIGHT'},config:{demoMode:'phone'}});
    report('preflight does not own attempt or lock', invalid.attempted === false && !alreadyCalled('REG-PREFLIGHT'));
    let raw = 'approved', condition = '', calls = 0, conversationTranscript = [];
    window.fetch = async (url, options) => {
      calls++;
      return new Response(JSON.stringify(options.method === 'POST' ? {success:true,conversation_id:'regression-mock'} : {
        status:'done',transcript:conversationTranscript,
        analysis:{data_collection_results:{decision:{value:raw},condition_text:{value:condition}}}
      }),{status:200,headers:{'Content-Type':'application/json'}});
    };
    const phone = {demoMode:'phone',agentId:'mock-agent',elevenKey:'mock-key',phoneNumberId:'mock-number',ownerPhone:'+819000000000'};
    let sequence = 0;
    const mockedCall = async extra => requestApproval({...args,config:phone,request:{...request,id:'REG-PHONE-'+sequence++},...extra});
    for (const [value, text, expected] of [['not approved','','no_answer'],['approved','','approved'],['approved','Check rounding','conditional'],['conditional','','no_answer'],['maybe approved','','no_answer'],['rejected','Too risky','rejected']]) {
      conversationTranscript = [{role:'user',message:value==='rejected' ? 'I reject this change. Too risky.' : value==='approved' ? `I approve this change.${text ? ' With a condition: '+text : ''}` : value}];
      raw=value;condition=text;const result=await mockedCall();report(`decision ${JSON.stringify(value)} / ${JSON.stringify(text)}`,result.decision===expected&&result.attempted===true);
    }
    for (const [label, rows] of [['absent transcript',undefined],['empty transcript',[]],['agent-only voicemail',[{role:'agent',message:'Are you there? Chris will follow up.'}]],['blank owner speech',[{role:'user',message:'   '}]]]) {
      conversationTranscript=rows;
      for (const value of ['approved','conditional','rejected']) {
        raw=value;condition=value==='conditional'?'Check rounding':'';
        const result=await mockedCall();
        report(`${label} cannot establish ${value}`,result.decision==='no_answer'&&Boolean(result.error)&&result.attempted===true&&result.conversation_id==='regression-mock'&&alreadyCalled('REG-PHONE-'+(sequence-1)));
      }
    }
    const before = calls;
    const noPolicy = await mockedCall({policy:{...policy,requires_call:false}});
    report('no policy trigger makes no call',calls===before&&noPolicy.attempted===false);
    const emptyImpact = await analyze(request,{files:{'billing.cbl':''},customers:[],lastChanged:{}},'');
    raw='approved';condition=''; const missing = await mockedCall({impact:emptyImpact});
    report('missing source evidence prevents approval attempt',missing.attempted===false,`paragraph=${emptyImpact.paragraph.name}; attempted=${missing.attempted}`);
    for (const [label, change] of [['negative record count',{affected_records:-1}],['fractional record count',{affected_records:1.5}],['affected exceeds total',{affected_records:3001}],['empty customer total',{total_records:0}],['missing definition',{definition:{line:0}}],['invalid history date',{last_changed:{date:'2009-02-30',by:'TANAKA'}}],['unknown history author',{last_changed:{date:'2009-04-01',by:'unknown'}}]]) {
      const before=calls,result=await mockedCall({impact:{...impact,...change}});
      report(label+' held before dialing',result.attempted===false&&calls===before);
    }
    const beforeOwner=calls,unknownOwner=await mockedCall({policy:{...policy,owner:'unknown'}});
    report('unknown owner held before dialing',unknownOwner.attempted===false&&calls===beforeOwner);
    ledger.append({change_id:'REG-LIVE',channel:'phone',decision:'approved'});
    ledger.append({change_id:'REG-CANNED',channel:'canned',decision:'conditional'});
    ledger.reset();
    report('demo reset preserves live evidence',ledger.all().length===1&&ledger.all()[0].change_id==='REG-LIVE');
    report('ledger rejects duplicate change',ledger.append({change_id:'REG-LIVE',channel:'canned'})===false);
    ledger.useDemoLedger();
    report('Demo Studio starts with separate evidence',ledger.all().length===0);
    ledger.append({change_id:'DEMO-REG-1',proposal_id:'CHG-0417',space:'demo',channel:'phone',decision:'no_answer'});
    report('Demo Studio cannot overwrite Workspace receipt',JSON.parse(memory.get('hanko.ledger')).length===1&&JSON.parse(memory.get('hanko.ledger'))[0].change_id==='REG-LIVE'&&ledger.all()[0].change_id==='DEMO-REG-1');
    ledger.append({change_id:'DEMO-REG-2',channel:'canned',decision:'conditional'});ledger.reset();
    report('Demo Studio reset retains its live rehearsal',ledger.all().length===1&&ledger.all()[0].change_id==='DEMO-REG-1');
  } catch (error) { report('harness completed',false,error.message); }
  finally {
    window.fetch=originalFetch;
    Object.defineProperty(window,'localStorage',storageDescriptor);
    output.textContent += `\n${passed} passed; ${failed} failed. Existing storage preserved.\n`;
    button.disabled=false;
  }
};
</script>
</html>
