<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hanko · Live setup check</title>
<style>body{background:#101216;color:#eee;font:17px/1.6 system-ui;max-width:850px;margin:50px auto;padding:24px}button{padding:14px 22px;font:inherit}pre{white-space:pre-wrap;border:1px solid #444;padding:24px;border-radius:12px}a{color:#ffa89a}</style>
<h1>Live setup check</h1><p>Read-only ElevenLabs API checks from this browser. This page does not place a call or access the microphone. No keys or phone numbers are displayed.</p>
<button id="check">Check live setup</button><pre id="output">Ready.</pre><a href="./">Back to Hanko</a>
<script src="config.js"></script><script type="module">
const out=document.getElementById('output'), button=document.getElementById('check');
button.onclick=async()=>{
 button.disabled=true;out.textContent='Checking…';
 const c=window.HANKO||{},lines=[];
 const report=line=>{lines.push(line);out.textContent=lines.join('\n');};
 try {
  if(!c.elevenKey||!c.agentId||!c.phoneNumberId) throw new Error('Missing API key, agent ID or phone number ID.');
  const get=async path=>{
   const response=await fetch('https://api.elevenlabs.io/v1/convai/'+path,{headers:{'xi-api-key':c.elevenKey},signal:AbortSignal.timeout(15000)});
   if(!response.ok) throw new Error('ElevenLabs HTTP '+response.status);
   return response.json();
  };
  const agent=await get('agents/'+encodeURIComponent(c.agentId));
  report('PASS: Browser can read Hanko agent: '+agent.name);
  const fields=Object.keys(agent.platform_settings?.data_collection||{});
  report(['decision','condition_text','rationale_quote'].every(k=>fields.includes(k))?'PASS: Three decision extraction fields present.':'FAIL: Decision extraction fields missing.');
  const phone=await get('phone-numbers/'+encodeURIComponent(c.phoneNumberId));
  report('PASS: Browser can read imported phone number. Provider: '+phone.provider);
  report(/^\+[1-9]\d{7,14}$/.test(c.ownerPhone||'')?'READY: Recipient mobile configured.':'PENDING: Recipient mobile number still needed.');
  report('No conversation or phone call was started.');
 }catch(error){report('FAIL: '+(error.name==='TimeoutError'?'API request timed out.':error.message));}
 finally{button.disabled=false;}
};
</script></html>
